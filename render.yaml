services:
  - type: web
    name: quantsage-proxy
    runtime: docker
    rootDir: proxy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PRIMARY_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: PROXY_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
