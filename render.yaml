services:
  - type: web
    name: quantsage-proxy
    runtime: docker
    rootDir: proxy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PRIMARY_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: PROXY_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: quantsage-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GROQ_PROXY_URL
        sync: false
      - key: VITE_PROXY_ACCESS_KEY
        sync: false
      - key: VITE_APP_PASSWORD
        sync: false
